<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>观看小助手 · 内容过滤设置</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="masthead">
      <img class="brand-mark" src="icons/icon-48.png" width="32" height="32" alt="" aria-hidden="true">
      <div>
        <h1>观看小助手</h1>
      </div>
      <span id="statusBadge" class="status-badge">已开启</span>
    </header>

    <main inert>
      <section class="master-control" aria-labelledby="masterTitle">
        <div>
          <h2 id="masterTitle">内容过滤</h2>
          <p id="ruleSummary">正在读取设置…</p>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="sr-only">启用内容过滤</span>
        </label>
      </section>

      <p id="siteStatus" class="site-status" role="status">正在识别当前页面…</p>

      <section id="syncNotice" class="sync-notice" hidden>
        <p>设置现在只保存在这台电脑上。旧版本曾把设置同步到浏览器账号，账号里还留着一份旧副本。删除后，其他设备上的旧版本会恢复默认设置。</p>
        <button id="removeSyncCopy" type="button">删除账号中的旧副本</button>
      </section>

      <section class="panel" aria-labelledby="tagTitle">
        <div class="section-heading">
          <div>
            <h2 id="tagTitle">隐藏标签</h2>
          </div>
          <span>按卡片上的标记筛选</span>
        </div>

        <div class="rule-list">
          <label class="rule-row">
            <input type="checkbox" name="hiddenLabel" value="uncensored">
            <span class="checkmark" aria-hidden="true"></span>
            <span><strong>无码影片</strong><small>隐藏带无码标记的视频</small></span>
          </label>
          <label class="rule-row">
            <input type="checkbox" name="hiddenLabel" value="chinese-subtitle">
            <span class="checkmark" aria-hidden="true"></span>
            <span><strong>中文字幕</strong><small>隐藏带中文字幕标记的视频</small></span>
          </label>
          <label class="rule-row">
            <input type="checkbox" name="hiddenLabel" value="other-subtitle">
            <span class="checkmark" aria-hidden="true"></span>
            <span><strong>其他字幕</strong><small>隐藏中文以外的字幕标记</small></span>
          </label>
          <label class="rule-row">
            <input id="hideUntagged" type="checkbox">
            <span class="checkmark" aria-hidden="true"></span>
            <span><strong>无标签</strong><small>隐藏没有可见标签的视频</small></span>
          </label>
        </div>
      </section>

      <section class="panel category-panel" aria-labelledby="categoryTitle">
        <div class="section-heading">
          <div>
            <h2 id="categoryTitle">分类条件</h2>
          </div>
          <span id="categoryCount">正在读取…</span>
        </div>
        <p id="categoryExplainer" class="category-explainer">按视频详情页上的分类筛选，隐藏条件优先。</p>

        <div class="category-picker include-picker" data-picker="include">
          <label for="categoryIncludeSearch" class="category-picker-label">
            <span>只显示这些分类</span>
            <small>留空表示不限制</small>
          </label>
          <div id="categoryIncludeField" class="category-chip-field">
            <input
              id="categoryIncludeSearch"
              type="search"
              placeholder="搜索并添加分类…"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="categoryIncludeSuggestions"
            >
          </div>
          <div id="categoryIncludeSuggestions" class="category-suggestions" role="listbox" hidden></div>
        </div>

        <div class="category-picker exclude-picker" data-picker="exclude">
          <label for="categoryExcludeSearch" class="category-picker-label">
            <span>隐藏这些分类</span>
            <small>命中即隐藏</small>
          </label>
          <div id="categoryExcludeField" class="category-chip-field">
            <input
              id="categoryExcludeSearch"
              type="search"
              placeholder="搜索并添加分类…"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="categoryExcludeSuggestions"
            >
          </div>
          <div id="categoryExcludeSuggestions" class="category-suggestions" role="listbox" hidden></div>
        </div>
      </section>

      <section class="panel actress-panel" aria-labelledby="actressTitle">
        <div class="section-heading">
          <h2 id="actressTitle">女优</h2>
        </div>
        <p id="actressExplainer" class="category-explainer">视频列出的每个名字算一人。</p>
        <div class="actress-control">
          <label class="actress-toggle" for="actressLimitEnabled">
            <span>按人数隐藏</span>
            <span class="switch switch-small">
              <input id="actressLimitEnabled" type="checkbox">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <label class="actress-limit" for="maxActresses">
            <span>超过</span>
            <input id="maxActresses" type="number" min="0" step="1" value="3" required aria-label="女优人数上限">
            <span>人时隐藏</span>
          </label>
        </div>
        <label class="actress-control actress-toggle" for="showActressNames">
          <span>封面显示姓名<small>左上角显示前三位，过长时省略</small></span>
          <span class="switch switch-small">
            <input id="showActressNames" type="checkbox">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <label class="scroll-control" title="关闭后，首页保持原样，其他列表页继续筛选">
        <span>首页生效<small>在首页应用筛选规则</small></span>
        <span class="switch switch-small">
          <input id="homepageEnabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
      <label class="scroll-control" title="滚动接近底部时，自动加载下一页">
        <span>连续滚动<small>自动加载下一页</small></span>
        <span class="switch switch-small">
          <input id="infiniteScroll" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </main>

    <footer inert>
      <span id="saveState" aria-live="polite">设置自动保存</span>
      <button id="resetButton" type="button">恢复默认</button>
    </footer>

    <script src="text.js"></script>
    <script src="label-library.js"></script>
    <script src="category-library.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
